name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Required by actions/deploy-pages: it mints an OIDC token rather than using a PAT.
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; queue instead, and don't cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall hook, which is `prisma generate` — without
      # it src/types.ts has nothing to derive from and the typecheck fails.
      - run: npm ci

      - name: Check the theme contract
        run: npm run theme:check

      - name: Typecheck
        run: npx tsc --noEmit -p tsconfig.json

      - name: Build
        env:
          # Publishable values. The anon key is meant to reach the browser —
          # row-level security, not secrecy, is what protects the data. They
          # live in repo secrets only to keep them out of the git history.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Pages serves the site from /<repo>/, so assets need that prefix.
          VITE_BASE: /${{ github.event.repository.name }}/
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
